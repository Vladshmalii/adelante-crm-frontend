server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Хешированные ассеты Vite — кешируем навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Рантайм-конфиг и index.html не кешируем, иначе не подхватятся новые релизы/env.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA: все неизвестные пути отдаёт роутер на клиенте.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
