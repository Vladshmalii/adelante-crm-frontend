# Adelante CRM — backend-инфраструктура (MVP, ≤20 салонов).
# Секреты — в .env рядом с этим файлом (см. .env.example).
services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres-master
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A workers.celery_app:celery worker -Q default,notifications -l info
    env_file: .env
    depends_on:
      - postgres-master
      - redis
    restart: unless-stopped

  # Строго один инстанс beat — иначе дубли периодических задач
  beat:
    build: ./backend
    command: celery -A workers.celery_app:celery beat -l info
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  ws:
    build: ./backend
    command: uvicorn ws.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - redis
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/admin/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8001/ws}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  postgres-master:
    image: postgres:17
    environment:
      POSTGRES_DB: adelante_master
      POSTGRES_USER: adelante
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD:-adelante}
    volumes:
      - master-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Один PG-инстанс на все шарды (шард = отдельная database);
  # при росте нагрузки добавляется второй инстанс, реестр укажет host
  postgres-shards:
    image: postgres:17
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHARD_ADMIN_PASSWORD:-postgres}
    volumes:
      - shards-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    # AOF: Redis — брокер Celery, потеря очереди = потеря уведомлений
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  master-data:
  shards-data:
  redis-data:
