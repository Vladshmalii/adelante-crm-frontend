# Alembic-окружение шард-БД (схема идентична для каждого салона).
# Целевая БД задаётся снаружи: salonctl передаёт готовый Connection через
# cfg.attributes["connection"], вручную — alembic -x db_url=postgresql+psycopg://...
[alembic]
script_location = migrations/shard
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
