# Alembic-окружение Master DB (реестр салонов, Client, Administrator, Master)
[alembic]
script_location = migrations/master
prepend_sys_path = .
# URL берётся из ADELANTE_MASTER_DB_DSN_SYNC (см. migrations/master/env.py);
# значение здесь — только фолбэк для ручного запуска
sqlalchemy.url = postgresql+psycopg://adelante:adelante@localhost:5432/adelante_master

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
