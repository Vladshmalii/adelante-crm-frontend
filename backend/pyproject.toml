[project]
name = "backend"
version = "0.1.0"
description = "Adelante CRM backend: Admin/Bot/Booking API, Celery workers, WS notifier, salonctl"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31",
    "psycopg[binary]>=3.2",
    "alembic>=1.18",
    "redis>=8.1",
    "celery>=5.5",
    "typer>=0.15",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "pyjwt>=2.13",
    "pwdlib[argon2]>=0.3",
    "httpx>=0.28",
    "websockets>=17",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "testcontainers>=4.15",
    "ruff>=0.16",
    "mypy>=1.14",
]

[project.scripts]
salonctl = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers", "ws"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["app", "workers", "ws", "cli.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
