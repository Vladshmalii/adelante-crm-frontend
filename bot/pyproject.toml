[project]
name = "bot"
version = "0.1.0"
description = "Adelante CRM Telegram bot (aiogram 3) — работает только через Bot API backend'а"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30",
    "httpx>=0.28",
    "pydantic-settings>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
